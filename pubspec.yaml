name: wasl_mobile
description: Wasl (وصل) — customer and merchant app for the neighbourhood grocery platform.
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  drift: ^2.22.1
  drift_flutter: ^0.2.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1
  mobile_scanner: ^6.0.2
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  local_auth: ^2.3.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  pdf: ^3.11.1
  printing: ^5.13.4
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
